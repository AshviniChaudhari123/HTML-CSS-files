<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login Clone</title>
    <link rel="stylesheet" href="form2.css">
</head>
<body>

    <div class="container">
        <!-- left side: text and logo -->
        <div class="left-section">
            <div class="logo-container">
                <!--instagram logo icon -->
                <img src="https://i.pinimg.com/originals/12/28/06/122806966a15c0e1d5232ce5c55b1fd5.jpg" alt="Instagram Logo" class="insta-logo">
            </div>
            <h1>See everyday moments from <br><span>your close friends.</span></h1>
            
            <!-- app store button -->
            <div class="app-store-badge">

                <img src="https://tse4.mm.bing.net/th/id/OIP.lBzdWfGrM7_TgISb7_xSuwHaHa?r=0&pid=Api&P=0&h=180" 
                alt="download on the app store" class="app-store-img">
            </div>
        </div>

        <!--right side: login form -->
        <div class="right-section">
            <div class="login-box">
                <h2>Log into Instagram</h2>
                
                <form>
                    <div class="input-group">
                        <input type="text" id="username" required placeholder=" ">
                        <label for="username">Mobile number, username or email</label>
                    </div>

                    <div class="input-group">
                        <input type="password" id="password" required placeholder=" ">
                        <label for="password">Password</label>
                    </div>

                    <button type="submit" class="login-btn">Log in</button>
                </form>

                <a href="#" class="forgot-password">Forgot password?</a>
                
                <button class="fb-login-btn">
                    <img src="https://freepngimg.com/convert-png/62487-bluetie-icons-computer-facebook-login-icon-email" alt="FB">
                    Log in with Facebook
                </button>

                <button class="create-account-btn">Create new account</button>
            </div>
        </div>
    </div>

</body>
</html>
