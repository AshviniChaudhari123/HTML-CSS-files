<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <!-- Font Awesome Icons link -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="form4.css">
</head>
<body>

    <div class="registration-container">
        <h2>Registration</h2>
        
        <form>
            <!-- Account Type Radio Buttons -->
            <div class="radio-group-inline">
                <label class="radio-label">
                    <input type="radio" name="account-type" checked>
                    <span class="custom-radio"></span> Personal
                </label>
                <label class="radio-label">
                    <input type="radio" name="account-type">
                    <span class="custom-radio"></span> Company
                </label>
            </div>

            <!-- Input Fields -->
            <div class="input-container">
                <div class="icon-box"><i class="fa-regular fa-envelope"></i></div>
                <input type="email" placeholder="Email" required>
            </div>

            <div class="input-container">
                <div class="icon-box"><i class="fa-regular fa-user"></i></div>
                <input type="text" placeholder="Name" required>
            </div>

            <div class="input-container">
                <div class="icon-box"><i class="fa-solid fa-lock"></i></div>
                <input type="password" placeholder="Password" required>
            </div>

            <!-- Gender Radio Buttons -->
            <div class="radio-group-inline gender-section">
                <label class="radio-label">
                    <input type="radio" name="gender" checked>
                    <span class="custom-radio"></span> Male
                </label>
                <label class="radio-label">
                    <input type="radio" name="gender">
                    <span class="custom-radio"></span> Female
                </label>
            </div>

            <!-- Footer Section with Terms and Register Button -->
            <div class="form-footer">
                <p class="terms-text">
                    By clicking Register, you agree on our <a href="#">terms and condition</a>
                </p>
                <button type="submit" class="register-btn">Register</button>
            </div>
        </form>
    </div>

</body>
</html>
