<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register Page</title>
    <!-- Font Awesome Link From Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- CSS File Link -->
    <link rel="stylesheet" href="form5.css">
</head>
<body>

    <div class="container">
        
        <!--right side: Welcome Back (Sign In) -->
        <div class="welcome-panel">
            <h2>Welcome Back!</h2>
            <p>Provide your personal details to use all features</p>
            <button class="btn btn-outline">SIGN IN</button>
        </div>

        <!-- left side: Register Form (Sign Up) -->
        <div class="form-panel">
            <h2>Register With</h2>
            
            <!-- social media icons -->
            <div class="social-icons">
                <a href="#" class="icon">
                <img src="https://static.vecteezy.com/system/resources/previews/013/734/184/original/3d-google-logo-google-is-usa-multinational-corporation-free-vector.jpg"
                alt="social icon" width="25" height="25">
                </a>

                <a href="#" class="icon">
                <img src="https://tse3.mm.bing.net/th/id/OIP.k2ngLxf6wwXOXiAgf3rfAgHaFj?r=0&pid=Api&P=0&h=180"
                alt="social icon" width="25" height="25">
                </a>

                <a href="#" class="icon">
                <img src="https://tse1.mm.bing.net/th/id/OIP.ExopCFEedUJCZ1zR_b455QHaHa?r=0&pid=Api&P=0&h=180"
                alt="social icon" width="25" height="25"
                </a>

               <a href="#" class="icon">
               <img src="https://static.vecteezy.com/system/resources/previews/023/986/970/original/linkedin-logo-linkedin-logo-transparent-linkedin-icon-transparent-free-free-png.png"
               alt="social icon" width="25" height="25"
               </a>
               
            </div>

            <span class="separator">OR</span>
            <p class="sub-text">Fill Out The Following Info For Registration</p>

            <!-- input form -->
            <form>
                <div class="input-group">
                    <input type="text" placeholder="Name" required>
                </div>
                <div class="input-group">
                    <input type="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn btn-solid">SIGN UP</button>
            </form>
        </div>

    </div>

</body>
</html>
