<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Championship Registration Form</title>
    <link rel="stylesheet" href="form6.css">
</head>
<body>

    <div class="form-container">
        <h2>School Championship Registration Form</h2>
        
        <form>
            <!-- School Name -->
            <div class="form-group">
                <label for="school-name">School name: <span class="required">*</span></label>
                <input type="text" id="school-name" required>
            </div>

            <!-- Schooler Name -->
            <div class="form-group">
                <label>Schooler name: <span class="required">*</span></label>
                <div class="row">
                    <div class="col">
                        <input type="text" id="student-first" placeholder="First" required>
                    </div>
                    <div class="col">
                        <input type="text" id="student-last" placeholder="Last" required>
                    </div>
                </div>
            </div>

            <!-- Parent Name -->
            <div class="form-group">
                <label>Parent name: <span class="required">*</span></label>
                <div class="row">
                    <div class="col">
                        <input type="text" id="parent-first" placeholder="First" required>
                    </div>
                    <div class="col">
                        <input type="text" id="parent-last" placeholder="Last" required>
                    </div>
                </div>
            </div>

            <!-- Parent Phone -->
            <div class="form-group">
                <label for="parent-phone">Parent phone: <span class="required">*</span></label>
                <input type="tel" id="parent-phone" placeholder="### ### ####" required>
            </div>

            <!-- Parent Email -->
            <div class="form-group">
                <label for="parent-email">Parent email: <span class="required">*</span></label>
                <input type="email" id="parent-email" required>
            </div>

            <!-- Preferred Sport -->
            <div class="form-group">
                <label for="preferred-sport">Preferred sport: <span class="required">*</span></label>
                <input type="text" id="preferred-sport" required>
            </div>

            <!-- Verification (Captcha Placeholder) -->
            <div class="form-group">
                <label>Verification: <span class="required">*</span></label>
                <div class="captcha-placeholder">
                    <input type="checkbox" id="captcha" required>
                    <label for="captcha">I'm not a robot</label>
                    <img src="https://c8.alamy.com/comp/2H5R76D/captcha-vector-icon-recaptcha-i-am-not-a-robot-isolated-security-symbol-vector-internet-generate-website-technology-computer-code-illustration-2H5R76D.jpg"
                    alt="captha" width="100" height="40">
            
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>

</body>
</html>
