<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="form3.css">
</head>
<body>

    <div class="form-container">
        <h2>Registration</h2>
        
        <form>
            <!-- Personal Details Section -->
            <div class="section-title">Personal Details</div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" placeholder="Enter your name">
                </div>
                
                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="text" id="dob" placeholder="Enter birth date">
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="mobile">Mobile number</label>
                    <input type="tel" id="mobile" placeholder="Enter mobile number">
                </div>
                
                <div class="form-group">
                    <label for="gender">Gender</label>
                    <input type="text" id="gender" placeholder="Enter your gender">
                </div>
                
                <div class="form-group">
                    <label for="occupation">Occupation</label>
                    <input type="text" id="occupation" placeholder="Enter occupation">
                </div>
            </div>

            
            <div class="section-title">Identity Details</div>

            <div class="form-row">
                <div class="form-group">
                    <label for="id-type">ID Type</label>
                    <input type="text" id="id-type" placeholder="Enter ID type">
                </div>
                
                <div class="form-group">
                    <label for="id-number">ID Number</label>
                    <input type="text" id="id-number" placeholder="Enter ID number">
                </div>
                
                <div class="form-group">
                    <label for="issue-authority">Issue Authority</label>
                    <input type="text" id="issue-authority" placeholder="Enter issue department">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="issue-date">Issue Date</label>
                    <input type="text" id="issue-date" placeholder="Enter ID issue date">
                </div>
                
                <div class="form-group">
                    <label for="issue-state">Issue State</label>
                    <input type="text" id="issue-state" placeholder="Enter ID issue state">
                </div>
                
                <div class="form-group">
                    <label for="expiry-date">Expiry Date</label>
                    <input type="text" id="expiry-date" placeholder="Enter ID expiry date">
                </div>
            </div>

            <!-- Next Button -->
            <button type="submit" class="next-btn">Next &rarr;</button>

        </form>
    </div>

</body>
</html>
