<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Photo Grid</title>
    <link rel="stylesheet" href="grid1.css">
</head>
<body>

    <div class="gallery-container">a
        <!-- Top Left 1: Grapes -->
        <div class="item grapes">
            <img src="https://thumbs.dreamstime.com/b/image-portrays-scene-vibrant-vineyard-sunset-focus-ripe-grapes-hanging-vine-ready-harvest-289101835.jpg" alt="grapes">
        </div>

        <!-- Top Left 2: Berries/Strawberries -->
        <div class="item berries">
            <img src="https://cdn.pixabay.com/photo/2023/11/11/06/43/strawberry-8380614_1280.jpg" alt="Berries">
        </div>

        <!-- Middle Left: Sliced Grapefruits/Oranges -->
        <div class="item oranges">
            <img src="https://tse1.mm.bing.net/th/id/OIP.ornaUlMMWOUH5cnnK6196gHaE2?r=0&pid=Api&P=0&h=180" alt="Oranges Sliced">
        </div>

        <!-- Bottom Left: Papaya / Fruit Cut -->
        <div class="item papaya">
            <img src="https://wallpapers.com/images/hd/delicious-fresh-papaya-fruits-43ksfk5mls6qqujv.jpg" alt="Papaya Yellow">
        </div>

        <!-- Right Side Big Box: Watermelon -->
        <div class="item watermelon">
            <img src="https://www.thegunnysack.com/wp-content/uploads/2019/07/Watermelon-Cubes.jpg" alt="Watermelon Cubes">
        </div>

        <!-- Bottom Right: Pineapples / Blue Background -->
        <div class="item pineapple">
            <img src="https://wallpapers.com/images/hd/pineapple-pictures-jcnc00xbupkq626z.jpg" alt="Pineapples">
        </div>
    </div>

</body>
</html>
