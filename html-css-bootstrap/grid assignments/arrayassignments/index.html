<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>

        <div class="container">
            <h1 class="dispaly-3 mb-2">1. To-Do List Manager</h1>
             <div class="mb-3">
                <input type="text" class="form-control mb-3" id="inputTask" >
                <button class="btn btn-primary" id="addNewTaskBtn">Add Task</button>
                <button class="btn btn-primary" id="clearAllBtn">Clear All</button>
             </div>
             <div id="toDos"></div>
        </div>

        <hr>
        <div class="container">
            <h1 class="dispaly-3 mb-2">Student Marks Calculator</h1>
            <div class="mb-3">
                <input type="number" class="form-control mb-3" id="inputMarks" >
                <button class="btn btn-primary" id="addMarksBtn">Add Marks</button>
                <button class="btn btn-primary" id="calculate">Calculate</button>
                <button class="btn btn-primary" id="resetMarks">Reset</button>
            </div>
            <div class="container" id="marksDisplay"></div>
        </div>

        <script src="./script.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
