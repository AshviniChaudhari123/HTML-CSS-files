<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3x3 Grid Layout</title>
    <link rel="stylesheet" href="grid6.css">
</head>
<body>

    <div class="gallery">
        <!-- Item 1: Top Left -->
        <div class="grid-item item-1">
            <img src="https://wallpapers.com/images/hd/sketch-pictures-801-x-993-69km6p9qcxqqxn2e.jpg" alt="Image 1">
        </div>

        <!-- Item 2: Main Highlighted / Featured (Center Top) -->
        <div class="grid-item item-featured">
            <img src="https://i.pinimg.com/736x/aa/ae/69/aaae69c37674fe43264609debc513e0e.jpg" alt="Featured Image">
        </div>

        <!-- Item 3: Top Right -->
        <div class="grid-item item-3">
            <img src="https://i.pinimg.com/736x/41/32/0e/41320e57b6fac7096017539ea51fb384.jpg" alt="Image 3">
        </div>


        <!-- Item 4: Middle Left -->
        <div class="grid-item item-4">
            <img src="https://tse2.mm.bing.net/th/id/OIP.ijybF7KkPS62gDXHYG7BZgHaK0?r=0&pid=Api&P=0&h=180" alt="Image 4">
        </div>

        <!-- Item 5: Center Middle -->
        <div class="grid-item item-5">
            <img src="https://tse3.mm.bing.net/th/id/OIP.7vKvAuJxZ8P4lJ1Kv_-prwHaFj?r=0&pid=Api&P=0&h=180" alt="Image 5">
        </div>

        <!-- Item 6: Middle Right -->
        <div class="grid-item item-6">
            <img src="https://tse3.mm.bing.net/th/id/OIP.Y7OUJxGEcAf3bhn53X6xZQHaIr?r=0&pid=Api&P=0&h=180" alt="Image 6">
        </div>

        <!-- Item 7: Bottom Left -->
        <div class="grid-item item-7">
            <img src="https://pbs.twimg.com/media/EYVsXhCXsAE_R0b.jpg:large" alt="Image 7">
        </div>

        <!-- Item 8: Bottom Center -->
        <div class="grid-item item-8">
            <img src="https://tse1.mm.bing.net/th/id/OIP.YZ0hKCLhZsSdylC9TQaonwHaHa?r=0&pid=Api&P=0&h=180" alt="Image 8">
        </div>

        <!-- Item 9: Bottom Right -->
        <div class="grid-item item-9">
            <img src="https://img.freepik.com/premium-vector/digital-sketch-vector-art-illustration-design-cute-girl-drawing_605379-10515.jpg?w=2000" alt="Image 9">
        </div>
    </div>

</body>
</html>
