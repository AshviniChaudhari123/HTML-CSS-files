<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagonal Grid Layout</title>
  <link rel="stylesheet" href="grid5.css">
</head>
<body>

  <div class="gallery-container">
    
    <!-- Left Top Image -->
    <div class="item item-1">
      <img src="https://picsum.photos/id/1015/800/600" alt="Landscape 1">
    </div>

    <!-- Left Bottom Image (Bridge) -->
    <div class="item item-2">
      <img src="https://picsum.photos/id/1040/800/800" alt="Bridge Image">
    </div>

    <!-- Center Text Box -->
    <div class="item item-3 text-box">
      <h1>THIS GRID WORKS</h1>
      <p>
        Lorem ipsum dolor sit amet, consectetuer adipiscing elit, 
        Ut wisi enim ad minim veniam, quis nostrud exerci tation ullamcorper suscipit lobortis nisl ut aliquip ex ea commodo consequat. Duis autem.
      </p>
    </div>

    <!-- Right Large Image (Mountains) -->
    <div class="item item-4">
      <img src="https://picsum.photos/id/1018/1000/800" alt="Mountain Landscape">
    </div>

    <!-- Right Top Corner Image -->
    <div class="item item-5">
      <img src="https://picsum.photos/id/1025/800/600" alt="Sunset Landscape">
    </div>

  </div>

</body>
</html>
