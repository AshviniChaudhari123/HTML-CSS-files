<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive CSS Grid Presentation</title>
  <link rel="stylesheet" href="grid3.css">
</head>
<body>

  <div class="presentation-container">
    
    <!-- Top Header Titles -->
    <div class="header-section">
      <div class="title-main">RESPONSIVE CSS GRID</div>
      <div class="title-sub">ONLY HTML & CSS</div>
    </div>

    <!-- Main Content Area with Grids and Arrow -->
    <div class="showcase-area">
      
      <!-- Left Grid Container (Desktop View) -->
      <div class="grid-card desktop-card">
        <div class="grid-desktop">
          <header class="navbar">NAVBAR</header>
          <aside class="sidebar">SIDEBAR</aside>
          <main class="main">MAIN</main>
          <section class="content1">CONTENT 1</section>
          <section class="content2">CONTENT 2</section>
          <section class="content3">CONTENT 3</section>
          <footer class="footer">FOOTER</footer>
        </div>
      </div>

      <!-- Arrow Indicator -->
      <div class="arrow-container">
        <div class="arrow">➥</div>
      </div>

      <!-- Right Grid Container (Mobile View) -->
      <div class="grid-card mobile-card">
        <div class="grid-mobile">
          <header class="navbar">NAVBAR</header>
          <aside class="sidebar">SIDEBAR</aside>
          <main class="main">MAIN</main>
          <section class="content1">CONTENT 1</section>
          <section class="content2">CONTENT 2</section>
          <section class="content3">CONTENT 3</section>
          <footer class="footer">FOOTER</footer>
        </div>
      </div>

    </div>

  </div>

</body>
</html>
